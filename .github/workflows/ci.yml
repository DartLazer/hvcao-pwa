name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuxt3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nuxt3/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Calculator regression tests
        run: npm run test:calc

      - name: Production build
        env:
          NUXT_PUBLIC_API_REMOTE_HOST: http://127.0.0.1:8002
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
