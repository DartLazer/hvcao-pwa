version: 2
updates:
  - package-ecosystem: npm
    directory: /nuxt3
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-patch-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-patch-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
